<head>

<meta name="description" content="Free learner licence (LL) practice for India: 431-question RTO question bank, state-wise timed mock tests, and road sign and traffic rule theory in English and Hindi.">

<meta property="og:type" content="website">

<meta property="og:description" content="Free learner licence (LL) practice for India: 431-question RTO question bank, state-wise timed mock tests, and road sign and traffic rule theory in English and Hindi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230f5ea8'/%3E%3Ccircle cx='20' cy='20' r='12' fill='%23fff' stroke='%23c8202b' stroke-width='3.5'/%3E%3Cpath d='M15 12V26H25' fill='none' stroke='%23111b24' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Learner License RTO Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Header, view area, fixed bottom tab bar. Palette borrows from Indian road signage: signal red, sign blue, kerb-paint neutrals. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#e6ebf0; --ink:#111b24; --muted:#56687a; --line:#d3dbe3;
  --brand:#0f5ea8; --brand-ink:#ffffff; --brand-soft:#e1eefa;
  --red:#c8202b; --good:#177a46; --good-bg:#e1f4ea; --bad:#b3261e; --bad-bg:#fbe5e3; --warn:#8a5a00; --warn-bg:#fdf1d6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141b; --surface:#16202a; --surface2:#1f2c38; --ink:#e7eef4; --muted:#9bb0c1; --line:#2b3b49;
  --brand:#5aa8f0; --brand-ink:#08121c; --brand-soft:#16293b;
  --red:#ff6a6f; --good:#52c98c; --good-bg:#12301f; --bad:#ff7d75; --bad-bg:#3a1b19; --warn:#f2b94b; --warn-bg:#352a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141b; --surface:#16202a; --surface2:#1f2c38; --ink:#e7eef4; --muted:#9bb0c1; --line:#2b3b49;
  --brand:#5aa8f0; --brand-ink:#08121c; --brand-soft:#16293b;
  --red:#ff6a6f; --good:#52c98c; --good-bg:#12301f; --bad:#ff7d75; --bad-bg:#3a1b19; --warn:#f2b94b; --warn-bg:#352a10; color-scheme:dark}
*{box-sizing:border-box}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{min-width:0}.brand .tt{min-width:0}
.lang{display:inline-flex;flex:none;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{padding:6px 12px;min-height:38px;font-weight:600;font-size:.85rem;color:var(--ink);background:transparent}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.setup{display:grid;gap:14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.promo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--brand-soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.promo h3{font-size:1.15rem}.promo p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.promo .btn{white-space:nowrap}
.sitefoot{max-width:760px;margin:8px auto 0;padding:14px 0 24px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line)}
.field{display:grid;gap:6px}.field>label,.field>.lbl{font-weight:600;font-size:.9rem}
.field .toolbar{padding:0;background:none;border:0;box-shadow:none;position:static}
.toolbar select{appearance:auto}
html[lang="hi"]{--f-display:"Noto Sans Devanagari","Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"Noto Sans Devanagari","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html[lang="hi"] body{line-height:1.7}
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3,html[lang="hi"] h4{line-height:1.4;letter-spacing:0}
html[lang="hi"] .brand h1{font-size:1.25rem}
html[lang="hi"] .tab span{line-height:1.3}
@media (max-width:420px){.brand small{display:none}.brand h1{font-size:1.3rem}}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 92px}
.wrap{max-width:760px;margin-inline:auto}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg{display:block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:40px;height:40px;flex:none}
.brand h1{font-size:1.55rem}
.brand small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.02em}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:760px}
.tab{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.7rem;font-weight:500;min-width:0}
.tab svg{width:24px;height:24px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}

/* shared */
.view{display:flex;flex-direction:column;gap:16px;padding-block:6px 8px}
.sec-title{font-size:1.9rem}
.lead{color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--brand);color:var(--brand-ink);min-height:46px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* home */
.menu{display:grid;gap:12px}
.opt-card{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.opt-card:hover{border-color:var(--brand)}
.opt-card svg{width:76px;height:76px}
.opt-card h2{font-size:1.5rem;margin-bottom:2px}
.opt-card p{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}

/* question bank */
.toolbar{display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;background:var(--bg);padding-block:6px}
.toolbar input[type=search],.toolbar select{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;min-height:46px}
.toolbar .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar .opts>*{min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.switch{display:flex;gap:8px;align-items:center;font-size:.85rem;font-weight:500}
.switch input{width:18px;height:18px;accent-color:var(--brand)}
.qlist{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;gap:8px;align-items:center}
.qno{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--brand);letter-spacing:.03em}
.qtext{font-weight:500}
.qimg{width:auto;height:auto;max-height:120px;max-width:min(100%,160px);border-radius:8px;background:#fff;padding:4px;border:1px solid var(--line)}
.opts-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .tag{flex:none;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px}
button.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.right .tag{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.wrong .tag{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.empty{text-align:center;color:var(--muted);padding:32px 12px}

/* mock test */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rules .stat b{font-size:2rem;color:var(--brand)}
.rule-list{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px}
.hist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-block:6px;font-size:.9rem}
.hist li:last-child{border:0}
.tbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;background:var(--bg);padding-block:6px;display:flex;flex-direction:column;gap:8px}
.tmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tmeta .qn{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.score{display:flex;gap:8px}
.sc{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.sc.ok{background:var(--good-bg);color:var(--good)}
.sc.no{background:var(--bad-bg);color:var(--bad)}
.timer{font-family:var(--f-display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.timer.low{color:var(--red)}
.segs{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.segs i{height:8px;border-radius:3px;background:var(--surface2)}
.segs i.ok{background:var(--good)}
.segs i.no{background:var(--bad)}
.segs i.cur{background:var(--brand)}
.tline{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.tline i{display:block;height:100%;background:var(--brand);width:100%;transition:width .25s linear}
.tline.low i{background:var(--red)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.to{background:var(--warn-bg);color:var(--warn)}
.confirm{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.result{display:flex;flex-direction:column;gap:14px}
.verdict{border-radius:16px;padding:20px;display:grid;gap:6px;justify-items:start}
.verdict.pass{background:var(--good-bg);color:var(--good)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.verdict .big{font-family:var(--f-display);font-size:4rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.verdict .big small{font-size:1.6rem;opacity:.75}
.verdict .vt{font-family:var(--f-display);font-size:1.5rem;font-weight:700;letter-spacing:.04em}
.rv{display:flex;flex-direction:column;gap:12px}
.rvq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rvq.ok{border-left:6px solid var(--good)}
.rvq.no{border-left:6px solid var(--bad)}

/* theory */
.chap-list{display:grid;gap:10px}
.chap{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.chap:hover{border-color:var(--brand)}
.chap svg{width:44px;height:44px}
.chap h3{font-size:1.2rem}
.chap p{font-size:.85rem;color:var(--muted)}
.back{align-self:flex-start;background:none;border:0;color:var(--brand);font-weight:600;padding:6px 0;display:flex;gap:6px;align-items:center}
.prose{display:flex;flex-direction:column;gap:12px}
.prose h3{font-size:1.35rem;margin-top:8px}
.prose ul{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:6px}
.note{background:var(--warn-bg);color:var(--ink);border-left:5px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-weight:600;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sign{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sign .pic{width:84px;height:84px;align-self:center}
.sign h4{font-size:1.1rem}
.sign p{font-size:.82rem;color:var(--muted)}
.alt{margin-top:4px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:center}
.alt svg{width:44px;height:44px;flex:none}
.alt small{font-size:.74rem;color:var(--muted);line-height:1.35}
.alt small b{color:var(--ink)}
.lights{display:grid;gap:10px}
.light{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dot{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.dot.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.mile i{display:block;width:34px;height:44px;border-radius:6px 6px 0 0;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.mk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.mk svg{width:96px;height:56px;border-radius:6px}
.mk.big{grid-template-columns:120px 1fr}.mk.big svg{width:120px;height:84px}
.mk.fig{grid-template-columns:80px 1fr;align-items:center}.mk.fig svg{width:80px;height:100px}
.foot{font-size:.78rem;color:var(--muted);padding-block:6px}
@media (max-width:420px){.opt-card{grid-template-columns:60px 1fr}.opt-card svg{width:60px;height:60px}.stats .stat b{font-size:1.4rem}.verdict .big{font-size:3.2rem}}
@media (prefers-reduced-motion:reduce){.dot.blink{animation:none}.tline i{transition:none}}
</style>
<style>
/* copy protection: no text selection, no image drag, no printing */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none;user-drag:none}
@media print{html,body{display:none!important}}
</style>
</head>

 {id:'mand',ic:()=>prohib(txt('',1,K),false),title:'1. Mandatory road signs',blurb:'Circles that give orders: prohibitions and compulsory directions',
  b:[
  {t:'p',x:'Mandatory (regulatory) signs tell you what you must or must not do. Breaking them is an offence under the Motor Vehicles Act. Most are circles. The only exceptions are STOP (an octagon) and GIVE WAY (an inverted triangle).'},
  {t:'table',head:['Shape and colour','What it means'],rows:[
   ['Circle with a red ring, white inside','Prohibition. Something is not allowed (no entry, no horn, no overtaking, speed limit).'],
   ['Circle filled blue, white symbol','Compulsory. You must follow the direction shown.'],
   ['Red octagon','STOP. Come to a full halt.'],
   ['Inverted triangle, red border','GIVE WAY to traffic on the major road.'],
   ['A red slash across a symbol','The activity shown is prohibited.']]},
  {t:'h',x:'Stop and give way'},sg('stop','giveway'),
  {t:'h',x:'Prohibitory signs (red ring)'},sg('noentry','oneway','bothdir','noovertake','noparking','nostop','nohorn','nouturn','noright','noleft','norightu','nopeds','nocycle','nohandcart','nomotor','notruck','nobullock','nobullockhand','notonga','speed','load','axle','width','height','length','endrestr'),
  {t:'h',x:'Compulsory signs (blue circle)'},sg('cleft','cright','cahead','caheadright','caheadleft','ckeepleft','cycletrack','chorn'),
  {t:'note',x:'Sign boards differ a little between states and older boards. The shape, colour and meaning stay the same. If you see a sign that looks different, check the shape and colour first.'}]},
 {id:'caut',ic:()=>warn(''),title:'2. Cautionary (warning) signs',blurb:'Triangles that warn of danger or a change in the road ahead',
  b:[
  {t:'p',x:'Cautionary signs are equilateral triangles with a red border and a black symbol on white. They warn you of a hazard ahead so you can slow down and get ready. They do not give an order, but you must drive with care.'},
  {t:'h',x:'Bends and gradients'},sg('lcurve','rcurve','hairpin','reverse','ascent','descent','speedbreaker','hump','dip'),
  {t:'h',x:'Road width and junctions'},sg('narrowroad','widens','narrowbridge','dualend','gapmedian','cross','majorroad','staggered','tjunc','yjunc','sideright','sideleft','roundabout'),
  {t:'h',x:'People, animals and works'},sg('pedcross','school','menwork','cattle','horses','cycle'),
  {t:'h',x:'Railways, surface and other hazards'},sg('llg','llu','slippery','rocks','ferry','barrier','gravel'),
  {t:'ul',items:['Unguarded level crossing: stop, look both ways, listen, then cross. Never try to beat a train.','Slippery road: reduce speed by changing to a lower gear. Avoid sudden braking and sharp turns.','School ahead: slow down and be ready to stop. When school buses stop to pick up or drop children, drive slowly.','A blind person with a white cane: treat it as a signal to stop and let them cross.']},
  {t:'note',x:'Drawings here are simplified. Real boards may show the same hazard with a slightly different picture.'}]},
 {id:'info',ic:()=>info(''),title:'3. Informative signs',blurb:'Rectangles that give directions, places and facilities',
  b:[
  {t:'p',x:'Informative (informatory) signs help you find places and services. They are rectangular. Blue boards mark facilities such as parking, fuel, first aid or a hospital. Direction and destination boards are usually green on national highways and expressways, and blue or white on other roads.'},
  sg('parking','hospital','firstaid','petrol','phone','eating','refresh','rest','nothru','nothruside','subway','footbridge','station','airport','taxi','police','advdir','destsign','reassure','placeid','dirsign','flood'),
  {t:'h',x:'Milestone colours'},
  {t:'p',x:'The colour on the top part of a roadside milestone tells you the class of road. It also helps if you are lost.'},
  {t:'milestones'},
  {t:'h',x:'Other things on direction boards'},
  {t:'ul',items:['Distances are shown in kilometres.','Route numbers such as NH 48 or SH 7 show the highway.','A stage or town name tells you which place is next.']}]},
 {id:'mark',ic:()=>S(`<rect width="100" height="100" rx="12" fill="#3b434b"/><path d="M50 8 V92" stroke="#f6c400" stroke-width="7" stroke-dasharray="16 10"/>`),title:'4. Road markings and lanes',blurb:'What the lines painted on the road mean',
  b:[
  {t:'p',x:'Traffic in India keeps to the left. Lines on the road tell you where you may overtake, change lanes, stop or cross.'},
  {t:'marks'},
  {t:'ul',items:['Broken white line: you may change lane or overtake when it is safe.','Continuous white line: do not cross it, and do not change lanes.','Continuous yellow line in the centre: do not overtake and do not cross it.','Double yellow line: never cross it.','Yellow broken line beside a solid one: if the broken line is on your side, you may overtake when it is safe.','Zebra crossing: pedestrians have priority. Stop behind the stop line.','Stop line: a white line across the road at junctions and crossings. Stop behind it, not on it.','Yellow or black-and-yellow kerb paint: no parking.','Keep to the left lane unless you are overtaking. On a multi-lane road, slow vehicles use the left lane.']},
  {t:'note',x:'Before changing lanes, check mirrors, give the indicator signal, and make sure the lane is clear. Do not zig-zag between lanes.'}]},
 {id:'sig',ic:()=>S(`<rect x="30" y="4" width="40" height="92" rx="10" fill="#222"/><circle cx="50" cy="26" r="12" fill="#e53935"/><circle cx="50" cy="50" r="12" fill="#f6b800"/><circle cx="50" cy="74" r="12" fill="#2e9e55"/>`),title:'5. Traffic lights and signals',blurb:'Signal lights, hand signals and police signals',
  b:[
  {t:'h',x:'Traffic lights'},
  {t:'lights',items:[['#e53935','Red','Stop behind the stop line. Do not move until the light changes.'],['#f6b800','Amber (yellow)','The light is about to turn red. Stop if you can do so safely. If you are already too close to stop, clear the junction.'],['#2e9e55','Green','Go, if the way is clear. Give way to pedestrians and vehicles still in the junction.'],['#e53935','Flashing red','Stop. Then proceed only if it is safe.',1],['#f6b800','Flashing yellow','Slow down and proceed with caution after making sure it is safe.',1]]},
  {t:'p',x:'A green arrow lets you turn in the direction shown, even when other traffic is held. At a junction with no lights and no police, give way to vehicles on your right and to traffic on the main road.'},
  {t:'h',x:'Hand signals by the driver'},
  {t:'ul',items:['Turning right: extend the right arm straight out, palm to the front.','Turning left: extend the right arm out and move it in an anticlockwise circle. Two-wheeler riders show this with the right hand.','Slowing down or stopping: extend the right arm out, palm down, and move it up and down several times.','Allowing the vehicle behind to overtake: extend the right arm out and move it backwards and forwards.','U-turn: show the right turn signal before turning.']},
   {t:'hsig',set:'driver'},
  {t:'p',x:'Hand signals are a back-up. Use the indicators when your vehicle has them. Give the signal early and keep it up until you start the turn.'},
  {t:'h',x:'Traffic police'},
  {t:'ul',items:['Arm raised, palm towards you: stop.','Arm extended sideways towards the side you face: traffic on that side may move.','Obey the police over signals and signs when they disagree.']},
   {t:'hsig',set:'police'}]},
 {id:'rules',ic:()=>S(`<rect x="8" y="8" width="84" height="84" rx="14" fill="#0f5ea8"/><path d="M30 70 V40 M30 40 L20 52 M30 40 L40 52 M70 30 V60 M70 60 L60 48 M70 60 L80 48" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>`),title:'6. Rules of the road',blurb:'Keeping left, overtaking, right of way, speed and junctions',
  b:[
  {t:'h',x:'Keeping left and overtaking'},
  {t:'ul',items:['Drive on the left side of the road. Keep to the left of the centre line.','Overtake from the right. The exception: you may pass on the left when the vehicle ahead has signalled a right turn and is moving to the centre of the road.','Before overtaking, check that the road ahead is clear, nothing is coming behind, and the vehicle ahead is not signalling to turn or overtake.','Do not overtake near a bend, a bridge, a hill crest, a junction, a pedestrian crossing, a narrow road, a school or a hospital, or where there is a continuous yellow line.','When someone is overtaking you, keep to the left and do not speed up.','Do not overtake when the vehicle behind has already started to overtake you.']},
  {t:'h',x:'Right of way'},
  {t:'ul',items:['Ambulances, fire engines and police vehicles on duty get free passage. Move to the left and let them go.','At a roundabout, traffic already on the roundabout has the right of way. Give way before you enter.','At a junction with no signals or police, give way to traffic on the main road, and to traffic from your right.','On a steep road, the vehicle going down gives way to the vehicle coming up the hill.','On a narrow bridge, wait for the other vehicle to cross first if it has already entered.','A vehicle leaving a side road gives way to traffic on the main road.']},
  {t:'h',x:'Pedestrians'},
  {t:'ul',items:['Stop for people waiting at a pedestrian crossing, and wait until they cross.','Where there is no footpath, pedestrians should walk on the right side of the road, facing the traffic.','Pedestrians should not cross near a sharp bend or right in front of a stopped vehicle. Drivers coming from far away may not see them.']},
  {t:'h',x:'Speed'},
  {t:'ul',items:['The speed limit depends on the type of vehicle, the type of road and the state. Always follow the sign, and slow down in bad weather and at night.','Roads near schools, hospitals and markets have the lowest limits, commonly about 25 to 30 km/h.','Keep a safe distance behind the vehicle ahead. Following too closely is called tailgating, and it is dangerous.','Over-speeding can lead to a fine and in some cases suspension of the licence.']},
  {t:'h',x:'U-turns and reversing'},
  {t:'ul',items:['Do not take a U-turn on a busy road, at a junction under signal control, or where it is prohibited.','Do not reverse on a one-way road, on a steep road, or into a main road from a side road.','Check mirrors and the blind spot before reversing or moving off.']},
  {t:'h',x:'Level crossings'},
  {t:'ul',items:['At a guarded crossing, stop when the gate is closed. Never go under or around a gate.','At an unguarded crossing, stop, get down if needed, check both tracks, and then cross.','Never stop on the track. Never overtake near a crossing.']}]},
 {id:'park',ic:()=>S(`<rect x="8" y="8" width="84" height="84" rx="12" fill="#0f5ea8"/><text x="50" y="72" text-anchor="middle" font-size="62" font-weight="700" font-family="Arial" fill="#fff">P</text>`),title:'7. Parking, horn and lights',blurb:'Where not to park, when to use horn, headlamps and fog lamps',
  b:[
  {t:'h',x:'Parking'},
  {t:'ul',items:['Park on the left side of the road, parallel to the kerb, so you do not block others.','Do not park on a footpath, in front of a hospital entrance, near a fire hydrant, on a bend, at a bus stop, at a pedestrian crossing, near a traffic light, on a bridge, or on a one-way road in a way that blocks traffic.','Do not park where the sign says No Parking or No Stopping.','At night, a parked vehicle must keep its parking lights on.','Before you get out: stop the engine, apply the hand brake, remove the key and lock the vehicle.','Parking uphill or downhill: engage a gear and turn the wheels towards the kerb.','Before opening a door on the traffic side, check that no vehicle or rider is coming.']},
  {t:'h',x:'Horn'},
  {t:'ul',items:['Use the horn only to warn others of your presence, never to attract attention or to hurry people.','Do not use it in silent zones: near hospitals, courts of law, educational institutions and places marked by No Horn signs.','Multi-toned and air horns are not allowed. Only a standard electric horn is permitted.','Do not blow the horn continuously.']},
  {t:'h',x:'Lights'},
  {t:'ul',items:['Use low (dipped) beam when a vehicle comes from the opposite direction, when you follow another vehicle closely, and in towns where the street is lit.','Use high beam only on dark open roads with no other traffic.','Fog lamps are for mist and fog. Do not use them in clear conditions.','Hazard warning lamps are for a breakdown or an emergency, or to warn of a hazard. Do not use them to justify illegal parking.','Switch on the headlamps in poor light, rain or fog, even in the daytime.','The registration plate must be lit at night.']}]},
 {id:'lic',ic:()=>S(`<rect x="8" y="22" width="84" height="56" rx="8" fill="#fff" stroke="#0f5ea8" stroke-width="5"/><circle cx="32" cy="46" r="9" fill="#0f5ea8"/><path d="M52 40 H80 M52 52 H80 M52 64 H70" stroke="#0f5ea8" stroke-width="5" stroke-linecap="round"/>`),title:'8. Licence, documents and the learner test',blurb:'Ages, validity, papers to carry and how the LL process works',
  b:[
  {t:'h',x:'Minimum age'},
  {t:'table',head:['Vehicle','Minimum age'],rows:[['Motorcycle without gear (up to 50 cc)','16 years'],['Motorcycle with gear, car (light motor vehicle)','18 years'],['Transport vehicles (taxi, bus, truck)','20 years']]},
  {t:'h',x:'Learner licence'},
  {t:'ul',items:['A learner licence is valid for 6 months.','You may apply for a permanent driving licence after 30 days from the issue of the learner licence, and before the learner licence expires.','A learner must drive with a licensed instructor or a licence holder beside them, and the vehicle should display an L sign.','A learner on a motorcycle may carry no one except an instructor who holds a licence for that type of vehicle.','The learner test is a computer-based test of road signs and traffic rules. This app copies its format with 15 questions.']},
  {t:'h',x:'Documents you must carry'},
  {t:'ul',items:['Driving licence.','Registration Certificate (RC) of the vehicle.','Valid insurance certificate. Third-party insurance is compulsory for every motor vehicle.','Pollution Under Control (PUC) certificate. Its validity commonly is 6 months, or 1 year for a new vehicle.','Tax token and permit where they apply (for example transport vehicles).','Digital copies shown on DigiLocker or mParivahan are accepted as valid.']},
  {t:'ul',items:['A driving licence issued in one state is valid throughout India.','A person who has no valid licence must not drive, and the owner must not hand the vehicle to such a person. Both are offences.','A vehicle that is not registered, or has no valid permit, may be seized by an authorised officer.','Hold only one licence. A single licence can list several classes of vehicle.']}]},

 {id:'acc',ic:()=>S(`<rect x="8" y="8" width="84" height="84" rx="14" fill="#fff" stroke="#c8202b" stroke-width="6"/><path d="M50 26 V74 M26 50 H74" stroke="#c8202b" stroke-width="14"/>`),title:'10. Accidents, first aid and safe driving',blurb:'What to do after an accident, and how to drive safely',
  b:[
  {t:'h',x:'If you are in an accident'},
  {t:'ul',items:['Stop at once. Do not drive away.','Switch off the engine, switch on the hazard lamps and warn other traffic.','Help the injured. Take all reasonable steps to get them medical attention, and take them to the nearest hospital if needed.','Report to the nearest police station within 24 hours. This applies to injury, death and damage to third-party property.','Inform your insurer as soon as possible.','If you hit a parked vehicle and cannot find the owner, report it to the police within 24 hours.','Emergency numbers: 112 (emergency), 108 (ambulance) and 1033 (national highway helpline).']},
  {t:'note',x:'Good Samaritan: under Indian law, a person who helps a road accident victim in good faith is protected from civil and criminal liability, and cannot be forced to give personal details.'},
  {t:'h',x:'First aid basics'},
  {t:'ul',items:['Aim: save life, prevent the injury getting worse and help recovery.','Do not move a badly injured person unless there is danger (fire, traffic).','Press firmly on a bleeding wound with a clean cloth.','Keep the person calm and warm until the ambulance comes.']},
  {t:'h',x:'Before and while driving'},
  {t:'ul',items:['Before starting: check fuel, engine oil, coolant, brake fluid, tyres, lights, mirrors and wipers.','Adjust the seat and mirrors, and wear your seat belt every time.','Look in the mirrors, signal, and check the blind spot before moving off.','Keep a safe distance. At higher speed, keep a bigger gap.','Never use a mobile phone, never drive tired, and never drive after drinking.','If you feel tired, stop in a safe place and rest. Do not rely on music or speed to stay awake.']},
  {t:'h',x:'Weather and road conditions'},
  {t:'ul',items:['Rain: slow down, keep a bigger distance, avoid sudden braking, and use the wipers. Do not drive through a flooded road without checking the depth.','Fog: use dipped headlamps or fog lamps, drive slowly, and do not use high beam, because it reflects back and dazzles you.','Skidding: ease off the accelerator and steer gently in the direction of the skid. Do not brake hard. Worn tyres and wet roads cause skids.','Steep downhill: use a low gear to hold speed. Pumping brakes too long causes brake fade, which reduces braking power. Do not coast in neutral.','Dazzled by oncoming headlights: slow down and, if needed, stop. Do not switch to high beam.','Burst front tyre: hold the steering wheel firmly and stop safely. Do not brake hard at once.']},
  {t:'h',x:'Vehicle knowledge'},
  {t:'ul',items:['ABS (anti-lock braking system) stops the wheels from locking when you brake, so the vehicle does not skid and you can still steer.','Power steering reduces the effort needed to turn the wheel.','Bald or worn tyres give little grip and are dangerous.','Exhaust gas contains carbon monoxide, which is poisonous. Never run an engine in a closed garage.','A vehicle in good tune pollutes less and uses less fuel. Drive at a steady moderate speed in a suitable gear to save fuel.']}]},
 {id:'two',ic:()=>S(`<rect x="8" y="8" width="84" height="84" rx="14" fill="#0f5ea8"/><g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"><circle cx="30" cy="66" r="12"/><circle cx="70" cy="66" r="12"/><path d="M30 66 L44 44 H62 L70 66 M44 44 L50 66 H30"/></g>`),title:'11. Two-wheeler rules',blurb:'Helmets, signalling, pillion rules and group riding',
  b:[
  {t:'ul',items:['Wear a helmet of the standard that is approved (BIS mark). It is compulsory for the rider and the pillion rider. Fasten the strap.','A two-wheeler may carry only one pillion rider, so a maximum of two people. More is an offence.','A motorcycle that carries a pillion rider must have a footrest, a handgrip and a sari guard.','Show the hand signal for a left turn with the right hand, and the right turn signal with the right arm.','When braking on a straight road, apply both brakes together. In a turn, use the rear brake gently first.','Do not ride between lanes or squeeze past a vehicle on the wrong side.','At night, wear bright or light clothing so you are seen.','In group riding, ride in a staggered line, with a safe distance, and not side by side.','When following a four-wheeler, keep to one side of the lane and not straight behind, so that you can see the road ahead.','Do not zig-zag, and do not weave in and out of traffic.','Passing a procession or men at work: slow down, and keep well to the left.']}]}

  'सूचनात्मक चिह्न आपको स्थान और सेवाएं ढूंढने में मदद करते हैं। ये आयताकार होते हैं। नीले बोर्ड पार्किंग, ईंधन, प्राथमिक चिकित्सा या अस्पताल जैसी सुविधाएं दर्शाते हैं। दिशा और गंतव्य बोर्ड राष्ट्रीय राजमार्गों और एक्सप्रेसवे पर आमतौर पर हरे और अन्य सड़कों पर नीले या सफेद होते हैं।',
  null,'मील के पत्थर के रंग','सड़क किनारे के मील के पत्थर के ऊपरी भाग का रंग सड़क की श्रेणी बताता है। रास्ता भटकने पर भी यह काम आता है।',null,'दिशा बोर्डों पर अन्य बातें',
  ['दूरी किलोमीटर में दिखाई जाती है।','NH 48 या SH 7 जैसे मार्ग क्रमांक राजमार्ग दर्शाते हैं।','पड़ाव या कस्बे का नाम बताता है कि अगला स्थान कौन-सा है।']]},
 {title:'4. सड़क पर निशान और लेन',blurb:'सड़क पर बनी रेखाओं का अर्थ',b:[
  'भारत में यातायात बाईं ओर चलता है। सड़क पर बनी रेखाएं बताती हैं कि आप कहां ओवरटेक कर सकते हैं, लेन बदल सकते हैं, रुक सकते हैं या पार कर सकते हैं।',
  null,
  ['सफेद टूटी रेखा: सुरक्षित होने पर आप लेन बदल सकते हैं या ओवरटेक कर सकते हैं।','सफेद अटूट रेखा: इसे पार न करें और लेन न बदलें।','बीच में पीली अटूट रेखा: ओवरटेक न करें और इसे पार न करें।','दोहरी पीली रेखा: इसे कभी पार न करें।','अटूट के बगल में पीली टूटी रेखा: यदि टूटी रेखा आपकी ओर है, तो सुरक्षित होने पर ओवरटेक कर सकते हैं।','ज़ेबरा क्रॉसिंग: पैदल यात्रियों को प्राथमिकता है। स्टॉप लाइन के पीछे रुकें।','स्टॉप लाइन: चौराहों और क्रॉसिंग पर सड़क के आर-पार बनी सफेद रेखा। उसके पीछे रुकें, उस पर नहीं।','पीला या काला-पीला कर्ब रंग: पार्किंग निषेध।','ओवरटेक करने के अलावा बाईं लेन में रहें। बहु-लेन सड़क पर धीमे वाहन बाईं लेन का उपयोग करते हैं।'],
  'लेन बदलने से पहले मिरर देखें, इंडिकेटर से संकेत दें और सुनिश्चित करें कि लेन खाली है। लेनों के बीच टेढ़े-मेढ़े न चलें।']},
 {title:'5. ट्रैफिक लाइट और संकेत',blurb:'सिग्नल लाइट, हाथ के संकेत और पुलिस के संकेत',b:[
  'ट्रैफिक लाइट',
  [['लाल','स्टॉप लाइन के पीछे रुकें। बत्ती बदलने तक न चलें।'],['एम्बर (पीली)','बत्ती लाल होने वाली है। यदि सुरक्षित रूप से रुक सकते हैं तो रुकें। यदि रुकने के लिए बहुत पास आ चुके हैं, तो चौराहा पार कर लें।'],['हरी','रास्ता साफ हो तो चलें। पैदल यात्रियों और चौराहे में फंसे वाहनों को रास्ता दें।'],['झपकती लाल','रुकें। फिर सुरक्षित होने पर ही आगे बढ़ें।'],['झपकती पीली','गति धीमी करें और सुरक्षित होने की पुष्टि करके सावधानी से आगे बढ़ें।']],
  'हरा तीर आपको दिखाई गई दिशा में मुड़ने देता है, भले ही अन्य यातायात रोका गया हो। जिस चौराहे पर बत्ती और पुलिस न हो, वहां अपनी दाईं ओर के वाहनों और मुख्य सड़क के यातायात को रास्ता दें।',
  'चालक के हाथ के संकेत',
  ['दाएं मुड़ना: दाईं भुजा सीधी बाहर फैलाएं, हथेली सामने की ओर।','बाएं मुड़ना: दाईं भुजा बाहर फैलाकर उसे वामावर्त (एंटीक्लॉकवाइज़) गोल घुमाएं। दोपहिया चालक यह संकेत दाएं हाथ से देते हैं।','गति धीमी करना या रुकना: दाईं भुजा बाहर फैलाकर, हथेली नीचे, कई बार ऊपर-नीचे हिलाएं।','पीछे वाले वाहन को ओवरटेक करने देना: दाईं भुजा बाहर फैलाकर आगे-पीछे हिलाएं।','यू-टर्न: मुड़ने से पहले दाएं मुड़ने का संकेत दें।'],
  null,
  'हाथ के संकेत सहायक होते हैं। जब वाहन में इंडिकेटर हों तो उनका उपयोग करें। संकेत जल्दी दें और मुड़ना शुरू करने तक बनाए रखें।',
  'यातायात पुलिस',
  ['भुजा ऊपर, हथेली आपकी ओर: रुकें।','जिस ओर आप देख रहे हैं उस ओर भुजा बगल में फैली हो: उस ओर का यातायात चल सकता है।','जब पुलिस और सिग्नल/चिह्न में अंतर हो, तो पुलिस का पालन करें।'],null]},
 {title:'6. सड़क के नियम',blurb:'बाईं ओर चलना, ओवरटेक, रास्ते का अधिकार, गति और चौराहे',b:[
  'बाईं ओर चलना और ओवरटेक',
  ['सड़क के बाईं ओर वाहन चलाएं। बीच की रेखा के बाईं ओर रहें।','ओवरटेक दाईं ओर से करें। अपवाद: जब आगे वाले वाहन ने दाएं मुड़ने का संकेत दिया हो और वह सड़क के बीच की ओर जा रहा हो, तब आप बाईं ओर से निकल सकते हैं।','ओवरटेक से पहले जांच लें कि आगे की सड़क साफ है, पीछे से कोई नहीं आ रहा है और आगे वाला वाहन मुड़ने या ओवरटेक करने का संकेत नहीं दे रहा है।','मोड़, पुल, पहाड़ी की चोटी, चौराहे, पैदल यात्री क्रॉसिंग, संकरी सड़क, स्कूल या अस्पताल के पास, या जहां पीली अटूट रेखा हो वहां ओवरटेक न करें।','जब कोई आपको ओवरटेक कर रहा हो, तो बाईं ओर रहें और गति न बढ़ाएं।','जब पीछे का वाहन आपको ओवरटेक करना शुरू कर चुका हो, तब ओवरटेक न करें।'],
  'रास्ते का अधिकार',
  ['एम्बुलेंस, अग्निशमन वाहन और ड्यूटी पर पुलिस वाहनों को निर्बाध रास्ता मिलता है। बाईं ओर हो जाएं और उन्हें जाने दें।','गोल चक्कर पर, जो यातायात पहले से उस पर है उसे रास्ते का अधिकार है। प्रवेश से पहले रास्ता दें।','जिस चौराहे पर सिग्नल या पुलिस न हो, वहां मुख्य सड़क के यातायात को और अपनी दाईं ओर के यातायात को रास्ता दें।','खड़ी ढलान पर, नीचे आने वाला वाहन चढ़ाई चढ़ने वाले वाहन को रास्ता देता है।','संकरे पुल पर, यदि दूसरा वाहन पहले ही पुल पर चढ़ चुका हो, तो उसके निकलने तक प्रतीक्षा करें।','बगल की सड़क से निकलने वाला वाहन मुख्य सड़क के यातायात को रास्ता देता है।'],
  'पैदल यात्री',
  ['पैदल यात्री क्रॉसिंग पर प्रतीक्षा कर रहे लोगों के लिए रुकें और उनके सड़क पार करने तक प्रतीक्षा करें।','जहां फुटपाथ न हो, वहां पैदल यात्रियों को सड़क के दाईं ओर, यातायात की ओर मुंह करके चलना चाहिए।','पैदल यात्रियों को तीखे मोड़ के पास या रुके वाहन के ठीक सामने सड़क पार नहीं करनी चाहिए। दूर से आ रहे चालक उन्हें नहीं देख पाते।'],
  'गति',
  ['गति सीमा वाहन के प्रकार, सड़क के प्रकार और राज्य पर निर्भर करती है। हमेशा चिह्न का पालन करें और खराब मौसम तथा रात में गति कम रखें।','स्कूल, अस्पताल और बाज़ार के पास की सड़कों पर सबसे कम सीमा होती है, आमतौर पर लगभग 25 से 30 किमी/घंटा।','आगे वाले वाहन से सुरक्षित दूरी रखें। बहुत पास पीछे चलना टेल-गेटिंग कहलाता है और यह खतरनाक है।','तेज़ गति से चलाना जुर्माने और कुछ मामलों में लाइसेंस के निलंबन का कारण बन सकता है।'],
  'यू-टर्न और रिवर्स',
  ['व्यस्त सड़क पर, सिग्नल-नियंत्रित चौराहे पर या जहां मना हो वहां यू-टर्न न लें।','एक-तरफा सड़क पर, खड़ी ढलान पर, या बगल की सड़क से मुख्य सड़क में रिवर्स न करें।','रिवर्स करने या वाहन आगे बढ़ाने से पहले मिरर और ब्लाइंड स्पॉट जांचें।'],
  'लेवल क्रॉसिंग',
  ['चौकीदार वाली क्रॉसिंग पर फाटक बंद हो तो रुकें। फाटक के नीचे या किनारे से कभी न निकलें।','बिना चौकीदार की क्रॉसिंग पर रुकें, ज़रूरत हो तो उतरें, दोनों पटरियां जांचें और फिर पार करें।','पटरी पर कभी न रुकें। क्रॉसिंग के पास कभी ओवरटेक न करें।']]},
 {title:'7. पार्किंग, हॉर्न और लाइटें',blurb:'कहां पार्क न करें, हॉर्न, हेडलैंप और फॉग लैंप कब',b:[
  'पार्किंग',
  ['सड़क के बाईं ओर, कर्ब के समानांतर पार्क करें ताकि दूसरों को बाधा न हो।','फुटपाथ पर, अस्पताल के प्रवेश द्वार के सामने, फायर हाइड्रेंट के पास, मोड़ पर, बस स्टॉप पर, पैदल यात्री क्रॉसिंग पर, ट्रैफिक लाइट के पास, पुल पर, या एक-तरफा सड़क पर यातायात को रोकते हुए पार्क न करें।','जहां चिह्न पर पार्किंग निषेध या रुकना निषेध लिखा हो वहां पार्क न करें।','रात में खड़े वाहन की पार्किंग लाइटें जलती रहनी चाहिए।','उतरने से पहले: इंजन बंद करें, हैंड ब्रेक लगाएं, चाबी निकालें और वाहन में ताला लगाएं।','चढ़ाई या ढलान पर पार्किंग: गियर लगाएं और पहियों को कर्ब की ओर घुमाएं।','यातायात की ओर का दरवाज़ा खोलने से पहले देख लें कि कोई वाहन या सवार नहीं आ रहा है।'],
  'हॉर्न',
  ['हॉर्न का उपयोग केवल दूसरों को अपनी उपस्थिति के प्रति सचेत करने के लिए करें, ध्यान आकर्षित करने या लोगों को जल्दी हटाने के लिए नहीं।','शांत क्षेत्रों में इसका उपयोग न करें: अस्पतालों, न्यायालयों, शैक्षणिक संस्थानों के पास और हॉर्न निषेध चिह्न वाली जगहों पर।','बहु-स्वर और एयर हॉर्न की अनुमति नहीं है। केवल मानक इलेक्ट्रिक हॉर्न की अनुमति है।','लगातार हॉर्न न बजाएं।'],
  'लाइटें',
  ['जब विपरीत दिशा से वाहन आए, जब आप किसी वाहन के पास पीछे चल रहे हों, और रोशनी वाली सड़क वाले शहरों में लो (डिप) बीम का उपयोग करें।','हाई बीम का उपयोग केवल अंधेरी खुली सड़कों पर करें जहां कोई अन्य यातायात न हो।','फॉग लैंप धुंध और कोहरे के लिए हैं। साफ मौसम में इनका उपयोग न करें।','हैज़र्ड वार्निंग लैंप वाहन खराब होने, आपातकाल या खतरे की चेतावनी के लिए हैं। अवैध पार्किंग को सही ठहराने के लिए उनका उपयोग न करें।','कम रोशनी, बारिश या कोहरे में दिन में भी हेडलैंप जलाएं।','रात में पंजीकरण प्लेट रोशन होनी चाहिए।']]},
 {title:'8. लाइसेंस, दस्तावेज़ और लर्नर टेस्ट',blurb:'आयु, वैधता, साथ रखने के कागज़ात और एलएल प्रक्रिया',b:[
  'न्यूनतम आयु',
  {head:['वाहन','न्यूनतम आयु'],rows:[['बिना गियर वाली मोटर साइकिल (50 सीसी तक)','16 वर्ष'],['गियर वाली मोटर साइकिल, कार (हल्का मोटर वाहन)','18 वर्ष'],['परिवहन वाहन (टैक्सी, बस, ट्रक)','20 वर्ष']]},
  'लर्नर लाइसेंस',
  ['लर्नर लाइसेंस 6 महीने के लिए वैध होता है।','लर्नर लाइसेंस जारी होने के 30 दिन बाद और उसके समाप्त होने से पहले आप स्थायी ड्राइविंग लाइसेंस के लिए आवेदन कर सकते हैं।','लर्नर को लाइसेंस प्राप्त प्रशिक्षक या लाइसेंस धारक के साथ ही वाहन चलाना चाहिए और वाहन पर L चिह्न लगा होना चाहिए।','मोटर साइकिल पर लर्नर किसी को नहीं बैठा सकता, सिवाय उस प्रशिक्षक के जिसके पास उस प्रकार के वाहन का लाइसेंस हो।','लर्नर टेस्ट सड़क चिह्नों और यातायात नियमों की कंप्यूटर आधारित परीक्षा है। यह ऐप राज्य के अनुसार इसका प्रारूप अपनाता है।'],
  'साथ रखने वाले दस्तावेज़',
  ['ड्राइविंग लाइसेंस।','वाहन का पंजीकरण प्रमाणपत्र (आरसी)।','वैध बीमा प्रमाणपत्र। हर मोटर वाहन के लिए थर्ड-पार्टी बीमा अनिवार्य है।','प्रदूषण नियंत्रण (पीयूसी) प्रमाणपत्र। इसकी वैधता आमतौर पर 6 महीने होती है, नए वाहन के लिए 1 वर्ष।','जहां लागू हो वहां टैक्स टोकन और परमिट (जैसे परिवहन वाहनों के लिए)।','डिजीलॉकर या एमपरिवहन पर दिखाई गई डिजिटल प्रतियां मान्य हैं।'],
  ['एक राज्य में जारी ड्राइविंग लाइसेंस पूरे भारत में वैध है।','जिस व्यक्ति के पास वैध लाइसेंस नहीं है वह वाहन नहीं चला सकता, और मालिक को भी ऐसे व्यक्ति को वाहन नहीं देना चाहिए। दोनों अपराध हैं।','जिस वाहन का पंजीकरण नहीं है या वैध परमिट नहीं है, उसे प्राधिकृत अधिकारी जब्त कर सकता है।','केवल एक लाइसेंस रखें। एक लाइसेंस में कई श्रेणियों के वाहन दर्ज हो सकते हैं।']]},
 {title:'9. अपराध और दंड',blurb:'सामान्य यातायात अपराध और आमतौर पर लगने वाले दंड',b:[
  {head:['अपराध','सामान्य दंड'],rows:[['नशे में वाहन चलाना (रक्त में 100 मिली पर 30 मिग्रा अल्कोहल से अधिक)','पहला अपराध: 6 महीने तक कारावास, 10,000 रुपये तक जुर्माना, या दोनों। बार-बार करने पर अधिक। लाइसेंस निलंबित हो सकता है।'],['बिना हेलमेट वाहन चलाना (चालक और पीछे बैठने वाला)','1,000 रुपये और 3 महीने के लिए लाइसेंस अयोग्यता'],['सीट बेल्ट न पहनना','1,000 रुपये'],['वाहन चलाते समय हाथ में मोबाइल फोन का उपयोग','5,000 रुपये तक जुर्माना'],['बिना वैध लाइसेंस वाहन चलाना','5,000 रुपये'],['बिना बीमा वाहन चलाना','2,000 रुपये, और संभावित कारावास'],['तेज़ गति से चलाना','हल्के वाहनों के लिए 1,000 रुपये, मध्यम और भारी वाहनों के लिए 2,000 रुपये; बार-बार करने पर निलंबन हो सकता है'],['खतरनाक ड्राइविंग','5,000 रुपये तक या कारावास; बार-बार करने पर अधिक'],['लाल बत्ती पार करना या स्टॉप चिह्न की अनदेखी','जुर्माना, और बार-बार करने पर लाइसेंस पर कार्रवाई'],['एम्बुलेंस या आपातकालीन वाहन को रोकना','10,000 रुपये'],['दोपहिया पर दो से अधिक व्यक्ति बैठाना','जुर्माना और संभावित लाइसेंस कार्रवाई'],['माल वाहन में ओवरलोडिंग','जुर्माना और प्रत्येक अतिरिक्त टन पर शुल्क, और माल उतरवाया जा सकता है'],['नाबालिग का वाहन चलाना','मालिक या अभिभावक पर भारी जुर्माना और कारावास हो सकता है, और पंजीकरण रद्द हो सकता है']]},
  'जुर्माने मोटर वाहन अधिनियम, 2019 के संशोधन के अनुसार तय हैं और राज्य इन्हें बदल सकते हैं। ऊपर दी गई राशियां अनुमानित हैं। नवीनतम राशि अपने आरटीओ या राज्य परिवहन विभाग से जांचें।',
  ['नशीले पदार्थों या शराब के प्रभाव में वाहन चलाना मोटर वाहन अधिनियम के तहत अपराध है और इससे लाइसेंस रद्द हो सकता है।','सड़क पर वाहन छोड़ देना जिससे असुविधा हो, लाइसेंस के निलंबन या रद्द होने का कारण बन सकता है।','सार्वजनिक सेवा वाहन चलाते समय धूम्रपान करना, या टैक्सी चालक का बिना कारण किराया लेने से मना करना, लाइसेंस कार्रवाई का कारण बन सकता है।','यदि आप पर जुर्माना लगे, तो उसे सबक मानें और अपनी ड्राइविंग सुधारें।']]},
 {title:'10. दुर्घटना, प्राथमिक चिकित्सा और सुरक्षित ड्राइविंग',blurb:'दुर्घटना के बाद क्या करें और सुरक्षित वाहन कैसे चलाएं',b:[
  'यदि आप किसी दुर्घटना में शामिल हों',
  ['तुरंत रुकें। वहां से भागें नहीं।','इंजन बंद करें, हैज़र्ड लैंप जलाएं और अन्य यातायात को सचेत करें।','घायलों की मदद करें। उन्हें चिकित्सा सहायता दिलाने के लिए सभी उचित कदम उठाएं और ज़रूरत हो तो निकटतम अस्पताल ले जाएं।','24 घंटे के भीतर निकटतम पुलिस थाने में रिपोर्ट करें। यह चोट, मृत्यु और तीसरे पक्ष की संपत्ति के नुकसान पर लागू है।','जल्द से जल्द अपने बीमाकर्ता को सूचित करें।','यदि आप किसी खड़े वाहन से टकरा जाएं और मालिक न मिले, तो 24 घंटे के भीतर पुलिस को सूचित करें।','आपातकालीन नंबर: 112 (आपातकाल), 108 (एम्बुलेंस) और 1033 (राष्ट्रीय राजमार्ग हेल्पलाइन)।'],
  'गुड सेमेरिटन: भारतीय कानून के तहत, जो व्यक्ति सद्भावना से सड़क दुर्घटना के पीड़ित की मदद करता है उसे दीवानी और आपराधिक दायित्व से संरक्षण मिलता है, और उसे व्यक्तिगत जानकारी देने के लिए बाध्य नहीं किया जा सकता।',
  'प्राथमिक चिकित्सा की बुनियादी बातें',
  ['उद्देश्य: जान बचाना, चोट को और बिगड़ने से रोकना और स्वस्थ होने में सहायता करना।','गंभीर रूप से घायल व्यक्ति को तब तक न हिलाएं जब तक खतरा (आग, यातायात) न हो।','बहते घाव पर साफ कपड़े से मज़बूती से दबाएं।','एम्बुलेंस आने तक व्यक्ति को शांत और गर्म रखें।'],
  'वाहन चलाने से पहले और चलाते समय',
  ['चलाने से पहले: ईंधन, इंजन ऑयल, कूलेंट, ब्रेक फ्लूड, टायर, लाइटें, मिरर और वाइपर जांचें।','सीट और मिरर समायोजित करें और हर बार सीट बेल्ट पहनें।','वाहन आगे बढ़ाने से पहले मिरर देखें, संकेत दें और ब्लाइंड स्पॉट जांचें।','सुरक्षित दूरी रखें। तेज़ गति पर अधिक अंतर रखें।','कभी मोबाइल फोन का उपयोग न करें, थके हुए न चलाएं और शराब पीकर न चलाएं।','थकान हो तो सुरक्षित स्थान पर रुककर आराम करें। जागे रहने के लिए संगीत या गति पर निर्भर न रहें।'],
  'मौसम और सड़क की स्थिति',
  ['बारिश: गति धीमी करें, अधिक दूरी रखें, अचानक ब्रेक से बचें और वाइपर चलाएं। गहराई जांचे बिना पानी भरी सड़क से न गुज़रें।','कोहरा: डिप हेडलैंप या फॉग लैंप का उपयोग करें, धीरे चलाएं और हाई बीम का उपयोग न करें क्योंकि वह वापस परावर्तित होकर आंखें चौंधिया देती है।','स्किड (फिसलन): एक्सेलरेटर से पैर हटाएं और स्टीयरिंग को हल्के से उसी दिशा में घुमाएं जिस दिशा में वाहन फिसल रहा है। तेज़ ब्रेक न लगाएं। घिसे टायर और गीली सड़क से स्किड होती है।','खड़ी उतराई: गति नियंत्रित करने के लिए निचला गियर लगाएं। ब्रेक को बहुत देर तक दबाने से ब्रेक फेड होता है जिससे ब्रेकिंग शक्ति घटती है। न्यूट्रल में न चलाएं।','सामने की हेडलाइट से आंखें चौंधिया जाएं: गति कम करें और ज़रूरत हो तो रुक जाएं। हाई बीम न जलाएं।','आगे का टायर फट जाए: स्टीयरिंग व्हील को मज़बूती से पकड़ें और सुरक्षित रूप से रुकें। एकदम से तेज़ ब्रेक न लगाएं।'],
  'वाहन संबंधी जानकारी',
  ['एबीएस (एंटी-लॉक ब्रेकिंग सिस्टम) ब्रेक लगाने पर पहियों को लॉक होने से रोकता है, जिससे वाहन फिसलता नहीं और आप स्टीयरिंग से नियंत्रण बनाए रख सकते हैं।','पावर स्टीयरिंग पहिया घुमाने में लगने वाला प्रयास कम करता है।','घिसे (बाल्ड) टायर कम पकड़ देते हैं और खतरनाक होते हैं।','वाहन के धुएं में कार्बन मोनोऑक्साइड होती है जो विषैली है। बंद गैराज में इंजन कभी न चलाएं।','ठीक से ट्यून किया वाहन कम प्रदूषण करता है और कम ईंधन खाता है। ईंधन बचाने के लिए उपयुक्त गियर में स्थिर मध्यम गति से चलाएं।']]},
 {title:'11. दोपहिया वाहन के नियम',blurb:'हेलमेट, संकेत, पीछे बैठने वाले के नियम और समूह में सवारी',b:[
  ['अनुमोदित मानक (बीआईएस चिह्न) का हेलमेट पहनें। यह चालक और पीछे बैठने वाले दोनों के लिए अनिवार्य है। पट्टा बांधें।','दोपहिया पर केवल एक पीछे बैठने वाला व्यक्ति हो सकता है, यानी अधिकतम दो व्यक्ति। इससे अधिक अपराध है।','पीछे बैठने वाले को ले जाने वाली मोटर साइकिल में फुट रेस्ट, हैंड ग्रिप और साड़ी गार्ड होना चाहिए।','बाएं मुड़ने का हाथ का संकेत दाएं हाथ से दें, और दाएं मुड़ने का संकेत दाईं भुजा से दें।','सीधी सड़क पर ब्रेक लगाते समय दोनों ब्रेक एक साथ लगाएं। मोड़ पर पहले पिछला ब्रेक हल्के से लगाएं।','लेनों के बीच से न निकलें और किसी वाहन के गलत ओर से जगह बनाकर न निकलें।','रात में चमकीले या हल्के कपड़े पहनें ताकि आप दिखाई दें।','समूह में सवारी करते समय सुरक्षित दूरी के साथ टेढ़ी (स्टैगर्ड) पंक्ति में चलें, साथ-साथ नहीं।','चार-पहिया वाहन के पीछे चलते समय लेन के एक ओर रहें, सीधे पीछे नहीं, ताकि आप आगे की सड़क देख सकें।','टेढ़े-मेढ़े न चलें और यातायात में इधर-उधर न घुसें।','जुलूस या काम करते कर्मचारियों के पास से गुज़रते समय गति धीमी करें और बाईं ओर बने रहें।']]}

  $('#tabs').innerHTML=VIEWS.map(v=>`<button class="tab" data-v="${v[0]}" ${cur===v[0]?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${v[2]}</svg><span>${esc(t(v[1]))}</span></button>`).join('');

  if(cur==='mock'&&T&&T.live&&v!=='mock'){pauseTimer()}
  cur=v;

  drawTabs();
  if(v==='home')renderHome();
  if(v==='qb')renderQB();

  if(v==='theory')renderTheory();

const qb={q:'',f:'all',show:true,limit:25,rev:{}};
function qCard(x,show,rev,interactive){
  const chosen=rev?rev[x.n]:undefined;
  const open=show||chosen!==undefined;
  const tx=qtx(x,lang);
  const opts=tx.o.map((tt,i)=>{
    const k=i+1; let cls='',tag='';
    if(open){ if(k===x.a){cls='right';tag=`<span class="tag">${esc(t('correct'))}</span>`} else if(chosen===k){cls='wrong';tag=`<span class="tag">${esc(t('yourPick'))}</span>`} }
    const inner=`<span class="k">${k}</span><span class="t">${esc(tt)}</span>${tag}`;
    return interactive&&!open?`<li><button class="opt" data-q="${x.n}" data-k="${k}">${inner}</button></li>`:`<li><div class="opt ${cls}">${inner}</div></li>`;
  }).join('');
  return `<article class="qcard"><div class="qhead"><span class="qno">Q${x.n}</span>${x.img?`<span class="pill">${esc(t('signTag'))}</span>`:''}</div><p class="qtext">${esc(tx.q)}</p>${x.img?`<img class="qimg" src="${x.img}" alt="${esc(t('signTag'))} Q${x.n}">`:''}<ul class="opts-list">${opts}</ul></article>`;
}
function qbFiltered(){
  const s=qb.q.trim().toLowerCase();
  return QB.filter(x=>{
    if(qb.f==='sign'&&!x.img)return false;
    if(qb.f==='rules'&&x.img)return false;
    if(!s)return true;
    if(/^#?\d+$/.test(s))return String(x.n)===s.replace('#','');
    const tx=qtx(x,lang);
    return (tx.q+' '+tx.o.join(' ')).toLowerCase().includes(s);
  });
}
function renderQB(){
  const chip=(f,k)=>`<button class="chip" data-f="${f}" aria-pressed="${qb.f===f}">${esc(t(k))}</button>`;
  $('#v-qb').innerHTML=`<div><h2 class="sec-title">${esc(t('qbTitle'))}</h2><p class="lead" id="qb-sub"></p></div>
    <div class="toolbar">
      <input type="search" id="qb-search" value="${esc(qb.q)}" placeholder="${esc(t('qbSearchPh'))}" aria-label="${esc(t('qbSearchAria'))}">
      <div class="opts">
        <div class="chips" role="group">${chip('all','fAll')}${chip('sign','fSign')}${chip('rules','fRules')}</div>
        <label class="switch"><input type="checkbox" id="qb-show" ${qb.show?'checked':''}> ${esc(t('showAns'))}</label>
      </div>
    </div>
    <div class="qlist" id="qb-list"></div><div class="row" style="justify-content:center"><button class="btn ghost" id="qb-more" hidden>${esc(t('showMore'))}</button></div>`;
  drawQB();
}
(function(){
  const v=$('#v-qb');
  v.addEventListener('input',e=>{if(e.target.id==='qb-search'){qb.q=e.target.value;qb.limit=25;drawQB()}});
  v.addEventListener('change',e=>{if(e.target.id==='qb-show'){qb.show=e.target.checked;qb.rev={};drawQB()}});

function drawQB(keep){
  const list=qbFiltered(); const y=window.scrollY;

function pauseTimer(){if(T&&T.iv){clearInterval(T.iv);T.iv=null;T.remain=Math.max(0,T.deadline-Date.now())}}

}
function renderMock(){
  if(T&&T.live){drawTest();if(!T.answered&&!T.iv){T.deadline=Date.now()+(T.remain||MOCK.secs*1000);T.iv=setInterval(tick,250);tick()}return}

  $('#v-mock').innerHTML=`<div><h2 class="sec-title">${esc(t('mockTitle'))}</h2><p class="lead" style="margin-top:6px">${esc(t('mockLead'))}</p></div>
   <div class="card setup">
    <div class="field"><label for="m-state">${esc(t('stateLabel'))}</label><div class="toolbar"><select id="m-state">${sorted.map(s=>`<option value="${s.id}" ${s.id===pref.st?'selected':''}>${esc(stName(s))}</option>`).join('')}</select></div></div>
    <div class="field"><span class="lbl" id="m-ql-l">${esc(t('qLangLabel'))}</span><div class="chips" role="group" aria-labelledby="m-ql-l"><button class="chip" data-ql="en" aria-pressed="${pref.ql==='en'}">English</button><button class="chip" data-ql="hi" lang="hi" aria-pressed="${pref.ql==='hi'}">हिन्दी</button></div></div>
   </div>

   ${hist.length?`<div class="card"><h3 style="margin-bottom:6px">${esc(t('recent'))}</h3><ul class="hist">${hist.slice(0,6).map(histRow).join('')}</ul></div>`:''}`;
}
function startMock(){
  const s=STATES[pref.st]; MOCK=cfgOf(s);
  T={qs:shuffle(QB).slice(0,MOCK.n),i:0,res:[],live:true,done:false,sel:0,answered:false,used:0,iv:null,st:s.id,ql:pref.ql,cfg:Object.assign({},MOCK)};
  drawTest();startTimer();
}
function startTimer(){
  pauseTimer(); T.qStart=Date.now(); T.deadline=T.qStart+MOCK.secs*1000;
  T.iv=setInterval(tick,250); tick();
}
function tick(){
  if(!T||!T.live||T.answered)return;
  const ms=T.deadline-Date.now(); const s=Math.max(0,Math.ceil(ms/1000));
  const el=$('#m-time'), bar=$('#m-tline');
  if(el){el.textContent=fmtT(s);el.classList.toggle('low',s<=10)}
  if(bar){bar.firstElementChild.style.width=Math.max(0,ms/(MOCK.secs*10))+'%';bar.classList.toggle('low',s<=10)}
  if(ms<=0)submit(true);
}
function counts(){const ok=T.res.filter(r=>r.ok).length;return {ok,no:T.res.length-ok}}
function drawTest(){
  const q=T.qs[T.i], tx=qtx(q,T.ql), c=counts(), last=T.i===MOCK.n-1;
  const segs=Array.from({length:MOCK.n},(_,k)=>{const r=T.res[k];return `<i class="${r?(r.ok?'ok':'no'):(k===T.i?'cur':'')}"></i>`}).join('');
  const r=T.res[T.i];
  let opts=tx.o.map((tt,k0)=>{
    const k=k0+1; let cls='',tag='';
    if(T.answered){ if(k===q.a){cls='right';tag=`<span class="tag">${esc(t('correct'))}</span>`} else if(r&&r.sel===k){cls='wrong';tag=`<span class="tag">${esc(t('yourPick'))}</span>`} }
    else if(T.sel===k)cls='sel';
    return `<li><button class="opt ${cls}" data-k="${k}" ${T.answered?'disabled':''}><span class="k">${k}</span><span class="t">${esc(tt)}</span>${tag}</button></li>`;
  }).join('');
  let fb='';
  if(T.answered){
    if(r.timeout)fb=`<div class="fb to" role="status">${esc(t('fbTime',{a:q.a}))}</div>`;
    else if(r.ok)fb=`<div class="fb ok" role="status">${esc(t('fbOk'))}</div>`;
    else fb=`<div class="fb no" role="status">${esc(t('fbNo',{a:q.a}))}</div>`;
  }
  $('#v-mock').innerHTML=`
   <div class="tbar">
     <div class="tmeta"><span class="qn num">${esc(t('qOf',{i:T.i+1,n:MOCK.n}))}</span>
       <div class="score" aria-label="${esc(t('scoreAria'))}"><span class="sc ok num" title="${esc(t('lCorrect'))}">&#10003; ${c.ok}</span><span class="sc no num" title="${esc(t('lWrong'))}">&#10007; ${c.no}</span></div>
       <span class="timer num" id="m-time" aria-label="${esc(t('timeAria'))}">${T.answered?'':fmtT(MOCK.secs)}</span></div>
     <div class="segs" aria-hidden="true">${segs}</div>
     <div class="tline" id="m-tline" aria-hidden="true"><i></i></div>
   </div>
   <article class="qcard"><div class="qhead"><span class="qno">Q${q.n}</span>${q.img?`<span class="pill">${esc(t('signTag'))}</span>`:''}</div><p class="qtext">${esc(tx.q)}</p>${q.img?`<img class="qimg" src="${q.img}" alt="${esc(t('signTag'))}">`:''}<ul class="opts-list">${opts}</ul>${fb}</article>
   <div class="row">${T.answered?`<button class="btn" id="m-next" style="flex:1">${esc(last?t('seeResult'):t('next'))}</button>`:`<button class="btn" id="m-sub" style="flex:1" ${T.sel?'':'disabled'}>${esc(t('submit'))}</button>`}<button class="btn ghost" id="m-quit">${esc(t('quit'))}</button></div>
   <div id="m-confirm"></div>`;
  if(T.answered){const el=$('#m-time');if(el){el.textContent='';}}
  else tick();
}
function submit(timeout){
  if(!T||T.answered)return;
  const q=T.qs[T.i]; const sel=timeout?0:T.sel;
  if(!timeout&&!sel)return;
  pauseTimer(); T.answered=true;
  T.used+=Math.min(MOCK.secs,Math.round((Date.now()-T.qStart)/1000));
  T.res[T.i]={n:q.n,sel:sel,ok:!timeout&&sel===q.a,timeout:!!timeout};
  drawTest();
}
function next(){
  if(T.i===MOCK.n-1){finish();return}
  T.i++;T.sel=0;T.answered=false;drawTest();startTimer();
}
function finish(){
  pauseTimer();
  const score=T.res.filter(r=>r.ok).length; T.live=false;T.done=true;T.score=score;
  const hist=store.get('llrto-hist',[]);
  hist.unshift({ts:Date.now(),score,total:MOCK.n,st:T.st,pass:score>=MOCK.pass});
  store.set('llrto-hist',hist.slice(0,20));
  drawResult();window.scrollTo(0,0);
}
function drawResult(){
  const c=T.cfg, pass=T.score>=c.pass;
  const wrong=T.res.filter(r=>!r.ok&&!r.timeout).length, to=T.res.filter(r=>r.timeout).length;
  const mm=Math.floor(T.used/60), ss=String(T.used%60).padStart(2,'0');
  const st=STATES[T.st];
  $('#v-mock').innerHTML=`<div class="result">
   <div class="verdict ${pass?'pass':'fail'}" role="status"><span class="vt">${esc(t(pass?'passed':'failed'))}</span><span class="big num">${T.score}<small>/${c.n}</small></span><span>${esc(t(pass?'passMsg':'failMsg',{p:c.pass}))}</span></div>
   <div class="stats"><div class="stat"><b class="num" style="color:var(--good)">${T.score}</b><span>${esc(t('lCorrect'))}</span></div><div class="stat"><b class="num" style="color:var(--bad)">${wrong}</b><span>${esc(t('lWrong'))}</span></div><div class="stat"><b class="num" style="color:var(--warn)">${to}</b><span>${esc(t('lTimed'))}</span></div></div>
   <div class="card row" style="justify-content:space-between"><span class="muted">${esc(t('accuracy'))}</span><b class="num">${Math.round(T.score/c.n*100)}%</b><span class="muted">${esc(t('timeUsed'))}</span><b class="num">${mm}:${ss}</b></div>
   <p class="foot">${esc(t('stateWord'))}: ${esc(stName(st))} · ${c.n} / ${fmtT(c.secs)} / ${c.pass}</p>
   <div class="row"><button class="btn" id="m-again" style="flex:1">${esc(t('again'))}</button><button class="btn ghost" data-go="home">${esc(t('menu'))}</button></div>
   <h3 style="margin-top:6px">${esc(t('reviewH'))}</h3>
   <div class="rv">${T.qs.map((x,i)=>{const r=T.res[i];const tx=qtx(x,T.ql);return `<div class="rvq ${r.ok?'ok':'no'}"><div class="qhead"><span class="qno">${i+1}. ${esc(t('bankQ'))}${x.n}</span><span class="pill" style="${r.ok?'background:var(--good-bg);color:var(--good)':'background:var(--bad-bg);color:var(--bad)'}">${esc(r.ok?t('lCorrect'):(r.timeout?t('timedPill'):t('lWrong')))}</span></div><p class="qtext">${esc(tx.q)}</p>${x.img?`<img class="qimg" src="${x.img}" alt="${esc(t('signTag'))}">`:''}<ul class="opts-list">${tx.o.map((tt,k0)=>{const k=k0+1;let cls='',tag='';if(k===x.a){cls='right';tag=`<span class="tag">${esc(t('correct'))}</span>`}else if(r.sel===k){cls='wrong';tag=`<span class="tag">${esc(t('yourPick'))}</span>`}return `<li><div class="opt ${cls}"><span class="k">${k}</span><span class="t">${esc(tt)}</span>${tag}</div></li>`}).join('')}</ul></div>`}).join('')}</div>
  </div>`;
}
$('#v-mock').addEventListener('click',e=>{
  if(!T||!T.live){

    <div class="chap-list">${CH.map((c,i)=>`<button class="chap" data-c="${i}">${c.ic()}<div><h3>${esc(chTitle(i))}</h3><p>${esc(chBlurb(i))}</p></div></button>`).join('')}</div>
    <p class="foot">${esc(t('theoryFoot'))}</p>`;
    v.querySelectorAll('.chap').forEach(b=>b.addEventListener('click',()=>{chap=+b.dataset.c;renderTheory();window.scrollTo(0,0)}));
  }else{
    const c=CH[chap], hb=lang==='hi'?CH_HI[chap].b:[];
    v.innerHTML=`<button class="back" id="t-back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg> ${esc(t('allChapters'))}</button>
    <h2 class="sec-title">${esc(chTitle(chap))}</h2><div class="prose">${c.b.map((b,k)=>block(b,hb[k])).join('')}</div>
    <div class="row">${chap>0?`<button class="btn ghost" id="t-prev">${esc(t('prev'))}</button>`:''}${chap<CH.length-1?`<button class="btn" id="t-next" style="flex:1">${esc(t('nextPre'))}${esc(chTitle(chap+1).replace(/^\d+\.\s*/,''))}</button>`:''}</div>`;
    $('#t-back').addEventListener('click',()=>{chap=null;renderTheory();window.scrollTo(0,0)});
    const p=$('#t-prev'),n=$('#t-next');
    if(p)p.addEventListener('click',()=>{chap--;renderTheory();window.scrollTo(0,0)});
    if(n)n.addEventListener('click',()=>{chap++;renderTheory();window.scrollTo(0,0)});
  }
}

applyLang();
go('home');
})();
</script>
<script>
/* Deterrent only: stops casual copying, right-click, dragging, print and common view-source shortcuts. */
(function(){
  var ok=function(e){var t=e.target;return t&&t.closest&&t.closest('input,textarea,select')};
  ['contextmenu','copy','cut','dragstart','selectstart'].forEach(function(n){
    document.addEventListener(n,function(e){if(ok(e)&&n!=='contextmenu'&&n!=='dragstart')return;e.preventDefault()},true)});
  document.addEventListener('copy',function(e){if(ok(e))return;try{e.clipboardData.setData('text/plain','')}catch(x){}e.preventDefault()},true);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
    if(k==='f12'||(c&&e.shiftKey&&'ijc'.indexOf(k)>-1&&k)||(c&&'cxaups'.indexOf(k)>-1&&k&&!ok(e))||(c&&(k==='u'||k==='s'||k==='p'))){e.preventDefault();e.stopPropagation()}
  },true);
  window.addEventListener('beforeprint',function(){document.documentElement.style.display='none'});
  window.addEventListener('afterprint',function(){document.documentElement.style.display=''});
})();
</script>
